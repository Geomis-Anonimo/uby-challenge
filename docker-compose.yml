services:
  mysql:
    image: mysql:8.0
    container_name: mob-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobilidade
      MYSQL_USER: mobilidade
      MYSQL_PASSWORD: mobilidade
    command: --default-authentication-plugin=mysql_native_password --slow-query-log=1 --long-query-time=0.3 --slow-query-log-file=/var/log/mysql/slow.log
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: mob-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    container_name: mob-api
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: mobilidade
      MYSQL_PASSWORD: mobilidade
      MYSQL_DATABASE: mobilidade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEMETRY_ENDPOINT: http://coletor:9000/ingest
      FLEETLINK_ENDPOINT: http://coletor:9000
      PAINEL_INTERVALO_MS: 2000
      PAINEL_JANELA: 20
      TELEMETRY_BATCH: 200
      TELEMETRY_FLUSH_MS: 30000
      FLEET_SIZE: 20
      FLEET_PING_MS: 2000
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      coletor:
        condition: service_started
    restart: unless-stopped

  coletor:
    build: ./api
    container_name: mob-coletor
    command: ["npx", "tsx", "src/coletor.ts"]
    environment:
      PORT: 9000
    ports:
      - "9000:9000"
    restart: unless-stopped

  frota:
    build: ./api
    container_name: mob-frota
    command: ["npx", "tsx", "src/sim/fleet.ts"]
    environment:
      API_URL: http://api:3000
      FLEET_SIZE: 20
      FLEET_PING_MS: 2000
      FLEET_CITY: 1
      FLEET_RESERVED: 6
      FLEET_SPREAD: 0.35
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: mob-web
    volumes:
      - ./web/public:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql-data:
